# Charivari — builds the Windows and Linux installers on GitHub's machines, tests that each plugin loads and plays, and
# attaches them to the release of the tag (the macOS installer is built and attached on the author's Mac: build_pkg.sh)
name: Windows and Linux installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages (GTK 3, WebKitGTK 4.1)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build and pack
        run: bash build_linux.sh
      - name: Load and play (no window)
        run: |
          cmake -S tests -B build_tests -DCMAKE_BUILD_TYPE=Release -DCLAP_INCLUDE_PATH="$PWD/deps/clap/include"
          cmake --build build_tests
          ./build_tests/clap_smoke "$(find dist -maxdepth 2 -name Charivari.clap | head -1)"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 20; done
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        shell: bash
        run: |
          bash fetch_deps.sh
          echo "VERSION=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' patch/charivari.cmajorpatch | head -1)" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: |
          cmake -S clap_project -B build -G "Visual Studio 17 2022" -A x64 -DCLAP_INCLUDE_PATH="$PWD/deps/clap/include" -DCLAP_WRAPPER_PATH="$PWD/deps/clap-wrapper" -DVST3_SDK_ROOT="$PWD/deps/vst3sdk"
          cmake --build build --config Release --target Charivari Charivari_vst3 --parallel
      - name: Load and play (no window)
        shell: bash
        run: |
          cmake -S tests -B build_tests -G "Visual Studio 17 2022" -A x64 -DCLAP_INCLUDE_PATH="$PWD/deps/clap/include"
          cmake --build build_tests --config Release
          ./build_tests/Release/clap_smoke.exe build/Release/Charivari.clap
      - name: Installer
        shell: pwsh
        run: |
          $stage = "stage"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item build/Release/Charivari.clap $stage/
          Copy-Item -Recurse build/Release/Charivari.vst3 $stage/
          New-Item -ItemType Directory -Force "$stage/Charivari.vst3/Contents/Resources" | Out-Null
          Copy-Item LICENSE, CREDITS.md "$stage/Charivari.vst3/Contents/Resources/"
          Copy-Item LICENSE, CREDITS.md $stage/
          Copy-Item -Recurse licences $stage/
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" "/DStage=$PWD\$stage" "/O$PWD\dist" packaging\windows\Charivari.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $exe = "dist\Charivari-$env:VERSION-Windows-x64-Setup.exe"
          $h = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$h  Charivari-$env:VERSION-Windows-x64-Setup.exe" | Out-File -Encoding ascii "$exe.sha256"
          Get-Content "$exe.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 20; done
          gh release upload "$GITHUB_REF_NAME" dist/*.exe dist/*.exe.sha256 --clobber
